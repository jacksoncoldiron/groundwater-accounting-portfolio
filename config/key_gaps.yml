# Key gaps — the marquee takeaways of the analysis
# ---------------------------------------------------------------------------
# Source: source_materials/Synthesis_Gaps_DesktopAnalysis.docx (analyst-authored,
# "DRAFT: ACTIVE EDITS"). This file is the editable home of that copy on the
# site; edit here, then re-render. Rendered by assets/js/key-gaps.js.
#
# Changes from the source document, all wording-only:
#   - superscript reference numbers removed (the reference list lives in a
#     separate working document that is not public); each gap instead links to
#     the synthesis topic and the filtered Findings Explorer behind it
#   - typos and agreement errors fixed; no claim added, removed or rescoped
#   - "Turlock" / "Salinas" kept as the source writes them
#
# Fields
#   id          stable anchor
#   title       the gap, as the source names it
#   issue       the source's parenthetical issue type
#   categories  DWR categories of findings: data_needs | best_practices | tool_development
#   body        the gap text (one or more paragraphs)
#   parts       optional sub-gaps (MLRP 3a–3c)
#   questions   optional open questions the source lists under the gap
#   topic       synthesis topic id the gap draws on (opens in the comparison)
#   findings    query string for findings.html
#
# REVIEW when a basin or evidence stream is added: these are cross-basin
# claims ("most", "four basins", "only one"). See notes/narrative_review.md.
# ---------------------------------------------------------------------------

categories:
  data_needs: Data needs
  best_practices: Best management practices
  tool_development: Tool development opportunity

chapters:
  isw:
    - id: isw-levels-stand-in
      title: Groundwater levels stand in for modeled depletion
      issue: Modeling capacity
      categories: [data_needs, best_practices]
      body: >-
        Numerical models are the gold standard for assessing streamflow
        depletion, and most of the GSAs analyzed use them to describe how much
        water moves between streams and aquifers. Compliance is measured
        differently: most basins track streamflow depletion with groundwater
        levels or streamflow alone, and Kaweah pairs groundwater levels with an
        analytical model. The plans give their reasons for using groundwater
        levels in place of modeled depletion — models not yet calibrated on
        specific streams, gage uncertainty, models too coarse to detect the
        expected changes, and the cost of updating models every year. Colusa's
        model memo recommends calibrating the groundwater-level proxy at the
        five-year update. The literature points to deriving per-well depletion
        factors that are then applied to reported pumping.
      topic: "1.3"
      findings: chapter=1.%20ISW&section=1.3%20Volumetric%20ISW%20Depletion%20Estimates

    - id: isw-per-well
      title: Attributing depletion to individual wells
      issue: Granularity
      categories: [data_needs, tool_development]
      body: >-
        GSPs outline depletion attribution at the reach or zone scale, not for
        individual wells. Some identify the missing input as exact well
        locations and screen depths; basins either remedy it through a
        voluntary well registry or note the missing depth records. The
        literature has introduced methods that attribute depletion to specific
        wells, though they tend to underestimate depletion — and using them
        would require well-level inputs that may not currently be available.
      topic: "1.5"
      findings: chapter=1.%20ISW&section=1.5%20Per-well%20Attribution%20and%20the%20Cumulative%20Pumping%20Problem

    - id: isw-depths
      title: Monitoring wells and pumping sit at different depths
      issue: Missing data
      categories: [data_needs]
      body: >-
        Four basins monitor ISW mainly with shallow-aquifer wells, while in some
        basins most pumping is deeper. Pumping below an aquitard may affect
        streams more slowly and weakly but can still deplete them over time,
        and identifying that connection takes long-term monitoring at each
        layer. Whether a well reflects stream conditions depends on its
        groundwater level relative to the stream and its distance from it.
        Basins manage the uncertainty by keeping the ISW network to shallow
        wells, limiting ISW consideration to reaches outside a mapped aquitard,
        or treating the shallow and intermediate zones as connected.
      topic: "1.6"
      findings: chapter=1.%20ISW&section=1.6%20Aquifer%20Depths

    - id: isw-coverage
      title: ISW monitoring coverage depends on grants
      issue: Insufficient data
      categories: [data_needs]
      body: >-
        ISW networks can be built from existing wells that meet depth and
        distance criteria, or from wells judged representative of depletion and
        surrounding groundwater levels. Turlock chooses monitoring wells by
        proximity and availability for data collection; Kaweah details efforts
        to add streamflow data and shallow, stream-adjacent monitoring. Some
        networks rely on very few sites — as few as one usable well — some key
        reaches have few gages, and new wells and gages depend on DWR's
        Technical Support Services, DWR Round 1 Implementation grants, or
        additional funds not yet secured.
      topic: "1.7"
      findings: chapter=1.%20ISW&section=1.7%20Limitations%20in%20Scope%2C%20Monitoring%2C%20Funding

    - id: isw-uncertainty
      title: Uncertainty in depletion estimates goes unreported
      issue: Communication
      categories: [best_practices]
      body: >-
        The literature treats calculating and communicating uncertainty in
        depletion estimates as crucial, especially when a model is used beyond
        the conditions it was built for. Kaweah reports depletion as a
        likelihood range and publishes model calibration statistics. The other
        subbasins describe uncertainty qualitatively in their GSPs.
      topic: "1.8"
      findings: chapter=1.%20ISW&section=1.8%20Gaps%20and%20Uncertainty

    - id: isw-baselines
      title: Thresholds anchored to drought, not ecological flow needs
      issue: Management
      categories: [best_practices]
      body: >-
        SGMA leaves the definition of "significant and unreasonable" depletion
        to each GSA. Where thresholds are set, most are tied to conditions
        during a recent drought. Yolo instead anchors its thresholds to a
        1971–2018 record that includes periods of disconnection, with the
        stated goal of maintaining conditions experienced in the past and
        avoiding habitat degradation from the current baseline. The California
        Environmental Flows Framework (CEFF) sets flow criteria from ecological
        needs across five seasonal flow components, and has been paired with
        groundwater sustainability efforts in at least one case.
      topic: "1.2"
      findings: chapter=1.%20ISW&section=1.2%20Undesirable%20Result%20Threshold

    - id: isw-shared-streams
      title: Depletion on streams shared between subbasins
      issue: Management
      categories: [best_practices, tool_development]
      body: >-
        Streams often run through more than one subbasin. The Merced River runs
        along the Merced–Turlock boundary, and each subbasin sets different
        criteria for it. Colusa's streams also form or cross GSA and subbasin
        boundaries. Turlock documents the difficulty of separating its pumping
        effects from its neighbors' on shared rivers, and plans to improve its
        model and reassess its ISW criteria and depletion estimates.
      topic: "1.5"
      findings: chapter=1.%20ISW&section=1.5%20Per-well%20Attribution%20and%20the%20Cumulative%20Pumping%20Problem

  mlrp:
    - id: mlrp-savings-math
      title: How is the water-savings math carried out?
      issue: Water savings calculation
      categories: [data_needs, best_practices, tool_development]
      body: >-
        Basins handle water savings from land repurposing differently. Merced
        monitors repurposing agreements quarterly and reports approximate
        consumptive-use reductions — but found that some fallowed and
        transitioning land kept transpiring from residual soil moisture and
        vegetation, so OpenET-based reductions came in lower than expected.
        Turlock designates repurposed land as Project Areas that are excluded
        from consumptive-use and ET tracking altogether. Kaweah publishes no
        savings estimate for its MLRP projects, and handles fallowed fields
        differently in each GSA: MKGSA replaces a fallowed field's measured ET
        with 80% of precipitation, so net consumptive use is zero and the
        field's full allocation can be used elsewhere or banked; GKGSA does not
        debit verified fallowed land; EKGSA credits back excess ET. Salinas
        Valley estimates fallowing savings in advance, from average crop and
        cover-crop water use, for planning scenarios.
      topic: "2.4"
      findings: chapter=2.%20MLRP&section=2.4%20Water%20Savings%20from%20Land%20Repurposing

    - id: mlrp-allocations
      title: Where does a repurposed parcel's allocation go?
      issue: Transferred allocations
      categories: [best_practices, tool_development]
      body: >-
        When a parcel enrolls in land repurposing, what happens to its pumping
        allocation? GSAs answer according to their basin's circumstances.
        Turlock temporarily rescinds the allocation while a landowner is
        enrolled in MLRP. Merced lets landowners choose, at application, whether
        to forfeit their groundwater allocation and any credits — and under its
        GSP, allocations that are not forfeited can be transferred, combined
        across parcels, and carried over to future years.
      questions:
        - Do enrolled parcels relinquish or retire their transitional water — and what about the sustainable-yield allocation?
        - Are landowners free to use those allocations elsewhere or transfer them to other properties?
        - If pumping rights are retired for the benefit of the basin, are landowners compensated for them explicitly, or does the incentive payment cover the value of relinquished credits?
      topic: "2.3"
      findings: chapter=2.%20MLRP&section=2.3%20Allocation%20and%20Leakage

    - id: mlrp-beyond-water
      title: How are benefits beyond water savings tracked?
      issue: Non-water benefits
      categories: [data_needs, best_practices]
      body: >-
        The literature offers ways to measure groundwater benefits beyond
        water: ecosystem services of groundwater-dependent ecosystems,
        groundwater targets that support ecosystems, well-failure impacts of
        different management regimes, and the water-quality and economic
        effects of retiring and repurposing land in buffers around
        disadvantaged communities. These methods may not fit neatly into GSA
        accounting systems. In practice, Merced scores regional ecological
        benefits and proximity to disadvantaged communities at application;
        Turlock prices MLRP practices differently according to their
        anticipated benefits; and Salinas presented a literature-based method
        (Rohde et al.) for identifying and monitoring GDEs, paired with
        CRAM field assessment — while recognizing that these methods cannot
        causally link groundwater management to GDE benefit.
      parts:
        - title: Dust
          body: >-
            GSA documents and the literature both recognize dust as a problem
            of land retirement, and repurposing as a way to mitigate it. Across
            basins, dust is named but not measured, treated as a landowner
            liability, named as an unmeasured co-benefit, or not mentioned at
            all. The literature is light here too: recent work quantifies
            fallowed-land dust risk regionally but stops short of a per-parcel
            method tied to repurposing.
          topic: "2.9"
        - title: Community benefit measurement
          body: >-
            The literature supplies methods ranging from overlays that
            attribute recharge benefits to specific communities to
            groundwater-level conversions that count domestic-well failures
            prevented. In practice, Merced screens by a fixed proximity buffer
            with no scoring behind it; Turlock developed a quantified buffer
            standard for schools that never reached its application,
            implementation standards or monitoring plan; Salinas uses a
            qualitative siting consideration around water quality and
            drinking-water-well access.
          topic: "2.6"
        - title: Monitoring vs. measurement
          body: >-
            The literature's own MLRP tools are prospective — they describe
            projected outcomes rather than verifying delivered ones. Of the
            documents analyzed, Turlock's is the one real monitoring
            architecture, and it confirms only that a project was built and
            persists, not how much benefit it produced.
          topic: "2.7"
      topic: "2.6"
      findings: chapter=2.%20MLRP&section=2.6%20Benefits%20Considered%20Beyond%20Water%20Savings

  community:
    - id: comm-domestic-wells
      title: Domestic-well impacts are not reported by community
      issue: Management and missing data
      categories: [data_needs, best_practices]
      body: >-
        The literature finds that domestic wells inside disadvantaged
        communities are less likely than wells elsewhere to be protected by
        local minimum thresholds, and that thousands of domestic and public
        supply wells could still go dry even if current sustainability criteria
        are met. Some basins estimate domestic-well exposure — Colusa counts
        wells above candidate thresholds — but in Colusa about half of the
        underlying well records lack screen depth, and many locations are
        approximate.
      topic: "3.1.4"
      findings: chapter=3.%20Community%20Considerations&section=3.1.4%20Domestic%20Well%20Protection%20as%20an%20Equity%20Outcome

    - id: comm-advance-notice
      title: Help arrives after the well fails
      issue: Procedural · platform opportunity
      categories: [tool_development]
      body: >-
        Most dry-well programs reviewed provide support after a household
        loses water. MKGSA plans to notify well owners as conditions approach
        levels that could affect their wells. Those notices depend on a
        voluntary well registry; the GSAs expect some owners to hesitate over
        privacy and property values, and plan to build trust through
        communication with local communities. Eligibility for support also
        depends on linking a well problem to groundwater management.
      topic: "3.3.1"
      findings: chapter=3.%20Community%20Considerations&section=3.3.1%20Dry%20Well%20Mitigation

    - id: comm-benefit-unit
      title: Community benefit has no unit
      issue: Best practice
      categories: [best_practices]
      body: >-
        Turlock's GSP records community benefit within MLRP management actions
        as an overlap with benefits to sustainability indicators, while also
        naming recreation and public health. Yolo uses yes-or-no flags in its
        proposed management actions table to identify projects that benefit
        disadvantaged communities. The documents define no unit for these
        fields, so benefits are not yet tracked or compared across projects,
        and it is not yet clear whether a link between community benefit and
        groundwater accounting is feasible.
      topic: "3.1.2"
      findings: chapter=3.%20Community%20Considerations&section=3.1.2%20Meaningful%20Benefits

    - id: comm-representation
      title: A board seat is not decision authority
      issue: Management · best practice
      categories: [best_practices]
      body: >-
        The literature finds that formal board representation predicts
        equity-related plan content better than outreach does. Plans describe
        who holds board seats and which committees advise the boards, and Yolo
        specifically describes the seats tied to disadvantaged communities. The
        plans say less about how seats and voting rules shape accounting
        decisions such as fees and pumping limits. In Salinas Valley, those two
        decisions require a supermajority that includes three of four
        agricultural representatives.
      topic: "3.1.3"
      findings: chapter=3.%20Community%20Considerations&section=3.1.3%20Procedural%2C%20Distributional%20and%20Representative%20Equity

    - id: comm-language
      title: Language access is uneven
      issue: Best practice · tool opportunity
      categories: [best_practices, tool_development]
      body: >-
        Turlock introduced Spanish-language access for video-based SGMA
        communication, fact sheets, and flyers promoting the Water Leadership
        Institute in partnership with EDF, and offered translation on request
        for Technical Advisory Committee meetings. MKGSA's mitigation plan
        includes a stakeholder outreach plan with at least one workshop in an
        underrepresented community, in English and Spanish.
      topic: "3.2"
      findings: chapter=3.%20Community%20Considerations&section=3.2%20Community%20Engagement

    - id: comm-water-quality
      title: Water-quality thresholds cover few constituents
      issue: Best practice and missing data
      categories: [data_needs, best_practices]
      body: >-
        Basins differ in which constituents carry water-quality thresholds.
        Merced focuses solely on salinity, Colusa on electrical conductivity,
        and Turlock on total dissolved solids. Salinas Valley reports
        constituents that exceed a regulatory standard, relying on the State's
        Title 22 drinking-water standards. Constituents requested by
        commenters, such as PFAS, were not adopted for lack of historical data
        and drinking-water standards. In East Turlock, expanded domestic-well
        testing runs through the State Water Board's SAFER program.
      topic: "3.3.2"
      findings: chapter=3.%20Community%20Considerations&section=3.3.2%20Water%20Quality

    - id: comm-facing-info
      title: Accounting platforms are built for growers
      issue: Communication
      categories: [best_practices, tool_development]
      body: >-
        Research on decision-driven data systems finds that different users
        need data in different formats, and stresses engaging decision
        stakeholders who may not have deep technical expertise; other work
        shows community knowledge can fill data gaps and build capacity for
        local policy decisions. The accounting platforms reviewed are built for
        landowners and growers. Community-facing products appear separately,
        such as Kaweah's seasonal groundwater-quality report and Salinas
        Valley's story map. Many community-facing resources exist — the
        Drinking Water Tool, CalEnviroScreen — but the plans do not yet point
        residents to them. In Salinas, the Castroville Community Services
        District is quoted asking for more outreach and education,
        specifically about seawater intrusion.
      topic: "3.3.4"
      findings: chapter=3.%20Community%20Considerations&section=3.3.4%20Data%20and%20Decision-Support%20Integration
