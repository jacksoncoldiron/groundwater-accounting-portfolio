# Canonical basin registry
# ---------------------------------------------------------------------------
# This file is the single source of truth for which basins exist, which are
# analyzed, and how they are labelled everywhere on the site.
#
# RULES
#   - `status: active`  -> counts toward public statistics, appears in explorer
#                          filters, and may appear in cross-basin conclusions.
#   - `status: planned` -> registered and shown as "analysis in progress".
#                          NEVER counted, never rendered as zero findings, and
#                          never treated as an absence finding.
#   - `include_in_analysis` is the hard gate the build pipeline enforces.
#   - Adding a basin = add a block here + add coded findings rows. No page
#     logic should need to change.
#
# METADATA PROVENANCE
#   Every descriptive field below is drawn from Phase2_CrossBasin_Synthesis.docx
#   or Phase2_Findings.xlsx. `source_ref` records where. Do not add a
#   descriptive value that cannot be traced to a source document.
# ---------------------------------------------------------------------------

schema_version: 1

basins:
  - id: merced
    slug: merced
    b118_number: "5-022.04"   # DWR Bulletin 118 subbasin number (map join key)
    name: Merced Subbasin
    short_name: Merced
    workbook_value: Merced          # exact `Subbasin` string in the findings workbook
    status: active
    include_in_analysis: true
    region: San Joaquin Valley
    order: 1
    gsas:
      - code: MSGSA
        name: Merced Subbasin GSA
      - code: MIUGSA
        name: Merced Irrigation-Urban GSA
      - code: TIWD GSA-1
        name: Turner Island Water District GSA-1
        note: >-
          Named in the synthesis as having no instrument in the reviewed
          document set; no findings are coded to it.
    profile:
      isw_model:
        value: MercedWRM
        detail: >-
          Quasi-3D numerical model on the IWFM 2015 platform, calibrated
          against ET, groundwater levels, and streamflow.
        source_ref: "Synthesis §1.1 (GSP §2.3.2, p. 2-207 [PDF 298])"
      accounting_platform:
        value: Groundwater Accounting Platform
        detail: ET data source is OpenET.
        source_ref: "Synthesis §2.5"
      mlrp_structure:
        value: MSGSA holds the Department of Conservation block grant directly
        detail: >-
          $8.89M DOC MLRP block grant awarded 16 June 2023 and held by MSGSA,
          alongside a locally funded Proposition 218 Phase 1 Land Repurposing
          Program.
        source_ref: "Synthesis §2.1 (GSP §6.2.2, p. 6-8 [PDF 469])"
      key_characteristic: >-
        The one basin that currently produces a measured water figure tied to
        a specific repurposing agreement, using its compliance instrument.
      key_characteristic_source_ref: "Synthesis §2.2 Comparison"

  - id: east-turlock
    slug: east-turlock
    b118_number: "5-022.03"   # DWR Bulletin 118 subbasin number (map join key)
    name: Turlock Subbasin
    short_name: East Turlock
    workbook_value: East Turlock
    status: active
    include_in_analysis: true
    region: San Joaquin Valley
    order: 2
    scope_note: >-
      Findings are coded to the East Turlock GSA within the Turlock Subbasin.
      Where a document covers the whole Turlock Subbasin, the finding is coded
      at SUBBASIN level.
    gsas:
      - code: ETSGSA
        name: East Turlock Subbasin GSA
      - code: WTSGSA
        name: West Turlock Subbasin GSA
        note: >-
          Runs no land repurposing program; the DOC grant was awarded to the
          Subbasin as a whole (Synthesis §2.1).
    profile:
      isw_model:
        value: C2VSimTM
        detail: >-
          Quasi-3D finite element model on the IWFM 2015 platform — the same
          model class as Merced — calibrated October 1991 to September 2015.
        source_ref: "Synthesis §1.1 (GSP §5.1.2, p. 5-3 [PDF 278])"
      accounting_platform:
        value: Groundwater Accounting Platform
        detail: ET data source is LandIQ, with CalETa for the historical baseline.
        source_ref: "Synthesis §2.5"
      mlrp_structure:
        value: ETSGSA runs the program under a subbasin-wide award
        detail: >-
          ETSGSA applied on behalf of both GSAs; DOC awarded the Subbasin
          $8.89M. Grant closes 31 March 2027.
        source_ref: "Synthesis §2.1 (WY 2025 Annual Report §8.2.5, pp. 8-34 to 8-35)"
      key_characteristic: >-
        Sets an ISW-specific undesirable result for each river; declared on two
        of three rivers in WY 2025 with no management consequence.
      key_characteristic_source_ref: "Synthesis §1.2 (GSP Table 6-20, p. 6-76 [PDF 450])"

  - id: salinas-valley
    slug: salinas-valley
    b118_number: "3-004.01"   # DWR Bulletin 118 subbasin number (map join key)
    # Eastside and Langley share the Greater Monterey County IRWM MLRP grant
    # (Synthesis §2.1); drawn on the map as grant-region context only.
    grant_region_extra: ["3-004.02", "3-004.09"]
    name: Salinas Valley — 180/400-Foot Aquifer Subbasin
    short_name: Salinas Valley
    workbook_value: Salinas Valley
    status: active
    include_in_analysis: true
    region: Central Coast
    order: 3
    gsas:
      - code: SVBGSA
        name: Salinas Valley Basin GSA
      - code: MCWD GSA
        name: Marina Coast Water District GSA
      - code: County of Monterey GSA
        name: County of Monterey GSA
    profile:
      isw_model:
        value: SVIHM
        detail: >-
          USGS-owned numerical model built on MODFLOW-OWHM v2. Produces a
          paired-simulation depletion estimate and mapped ISW locations, but
          the compliance criterion runs on shallow-well elevation readings
          rather than model output.
        source_ref: "Synthesis §1.1 (Amendment 1 Table 5-7, PDF p192)"
      accounting_platform:
        value: No accounting platform identified in the reviewed documents
        detail: >-
          Recorded as an absence in the reviewed document set, not as a
          statement that none exists.
        source_ref: "Synthesis §2.5 and §3.3.4 Comparison"
      mlrp_structure:
        value: MLRP grant held outside the GSA
        detail: >-
          The Greater Monterey County IRWM Group holds a $10M DOC grant
          covering the 180/400, Eastside and Langley subbasins; SVBGSA is a
          partner. The money buys land rather than paying for practices.
        source_ref: "Synthesis Chapter 2 scope note and §2.1"
      key_characteristic: >-
        Has commissioned direct field measurement of stream-aquifer exchange,
        and pairs a disadvantaged-community board seat with a supermajority
        rule for fees and pumping limits.
      key_characteristic_source_ref: "Synthesis §1.4 and §3.1.3"

  - id: kaweah
    slug: kaweah
    b118_number: "5-022.11"   # DWR Bulletin 118 subbasin number (map join key)
    name: Kaweah Subbasin
    short_name: Kaweah
    workbook_value: Kaweah
    status: active
    include_in_analysis: true
    region: San Joaquin Valley
    order: 4
    scope_note: >-
      Three GSAs each filed a separate GSP under one Coordination Agreement and
      a shared ISW technical memorandum. Mid-Kaweah reports no interconnected
      surface water.
    gsas:
      - code: EKGSA
        name: East Kaweah GSA
      - code: GKGSA
        name: Greater Kaweah GSA
      - code: MKGSA
        name: Mid-Kaweah GSA
    profile:
      isw_model:
        value: Kaweah Subbasin Groundwater Flow Model + Hunt analytical function
        detail: >-
          MODFLOW-OWHM v2 calibrated to groundwater elevations only; the GSAs
          state it is not yet calibrated for ISW depletion, so depletion is
          estimated with an analytical stream-depletion function.
        source_ref: "Synthesis §1.1 (ISW TM §1, §3.2)"
      accounting_platform:
        value: Water Dashboard (parcel-level satellite ET ledger)
        detail: Land IQ ET tracked per parcel per month, with a trading module.
        source_ref: "Synthesis §2.5, §3.3.4"
      mlrp_structure:
        value: Subbasin-level award implemented by the three GSAs
        detail: >-
          $10M in MLRP funding according to a Self-Help Enterprises comment
          reproduced in the GSPs; three recharge-basin projects listed in the
          WY 2025 Annual Report.
        source_ref: "Synthesis §2.1"
      key_characteristic: >-
        The one basin that attaches a likelihood range to its depletion
        estimate, and the one with a water-trading market in operation.
      key_characteristic_source_ref: "Synthesis §1.8 and §2.3 Comparison"

  - id: colusa
    slug: colusa
    b118_number: "5-021.52"   # DWR Bulletin 118 subbasin number (map join key)
    name: Colusa Subbasin
    short_name: Colusa
    workbook_value: Colusa
    status: active
    include_in_analysis: true
    region: Sacramento Valley
    order: 5
    gsas:
      - code: CGA
        name: Colusa Groundwater Authority
      - code: GGA
        name: Glenn Groundwater Authority
    profile:
      isw_model:
        value: C2VSimFG-Colusa
        detail: >-
          Numerical model adapted from DWR's C2VSimFG on a monthly timestep;
          its authors describe it as not yet well calibrated and label its ISW
          conclusions provisional.
        source_ref: "Synthesis §1.1 (GSP Appendix 3G)"
      accounting_platform:
        value: Accounting system in procurement
        detail: >-
          The GSAs selected a consultant team in late 2025 to build a subbasin
          water accounting system.
        source_ref: "Synthesis §3.3.4"
      mlrp_structure:
        value: No MLRP block grant
        detail: >-
          The main repurposing-type activity is The Nature Conservancy's winter
          flooding of farmland for shorebird habitat and recharge.
        source_ref: "Synthesis §2.10"
      key_characteristic: >-
        Counts domestic wells above candidate thresholds; the revised
        thresholds cut projected impacts from 589 wells to 99.
      key_characteristic_source_ref: "Synthesis §3.1.4 (Appendix 5E)"

  - id: yolo
    slug: yolo
    b118_number: "5-021.67"   # DWR Bulletin 118 subbasin number (map join key)
    name: Yolo Subbasin
    short_name: Yolo
    workbook_value: Yolo
    status: active
    include_in_analysis: true
    region: Sacramento Valley
    order: 6
    gsas:
      - code: YSGA
        name: Yolo Subbasin Groundwater Agency
    profile:
      isw_model:
        value: Linked WEAP–MODFLOW
        detail: >-
          Built from an earlier Yolo County IWFM; monthly timestep for WY
          1971–2018, calibrated on Putah and Cache creeks and the Yolo Bypass.
        source_ref: "Synthesis §1.1 (GSP §2.3.1)"
      accounting_platform:
        value: No allocation or fee system
        detail: >-
          The documents contain no mechanism that distributes pumping limits or
          costs between groups.
        source_ref: "Synthesis §3.1.3"
      mlrp_structure:
        value: No MLRP block grant
        detail: >-
          Repurposing-type projects sit in the GSP project list, mostly led by
          community groups, a Tribe, districts or the County.
        source_ref: "Synthesis §2.10"
      key_characteristic: >-
        Anchors ISW thresholds to a 1971–2018 record rather than a recent
        drought, across five ISW Management Zones.
      key_characteristic_source_ref: "Synthesis §1.2"

# ---------------------------------------------------------------------------
# GSA display names for codes that appear in the workbook but are not a GSA.
# Used so the explorer can label these honestly rather than as agencies.
# ---------------------------------------------------------------------------
gsa_labels:
  SUBBASIN:
    label: Subbasin-level
    kind: scope
    description: >-
      The finding applies to the subbasin as a whole rather than to a single
      GSA.
  NON-GSA:
    label: Non-GSA entity
    kind: other
    description: >-
      The finding is attributed to an organization that is not a GSA.
  COMMENTER:
    label: Public commenter
    kind: other
    description: >-
      The finding comes from a public comment letter rather than an agency
      document.
