# Document link overrides
# ---------------------------------------------------------------------------
# Public URLs for the source documents cited in the Findings Explorer.
#
# HOW THIS WORKS
#   The build reads the document registry in the `Legend` sheet of the findings
#   workbook first, then applies this file ON TOP of it. An entry here wins.
#   Nothing else on the site ever produces a document link -- URLs are never
#   inferred or constructed.
#
# HOW TO USE IT
#   Fill in the `url:` for any document below. Leave it as `null` to publish no
#   link for that document. Then run:
#
#       python3 scripts/build_data.py && quarto render
#
#   Keys are the exact `Document` string from the findings workbook. They are
#   pre-filled with every document that currently has at least one finding, so
#   you only need to paste URLs.
#
#   `suppress: true` blocks a Legend link you know to be wrong without editing
#   the workbook.
#
# NOTE ON THE TWO WITHHELD LINKS
#   The Turlock GSP Appendix K and L rows in the Legend carry Salinas Valley
#   URLs. They are marked `suppress: true` below. Replace the `url:` with the
#   correct link and set `suppress: false` to publish them.
# ---------------------------------------------------------------------------

